[workspace]
resolver = "2"
members = [
    "apps/proxy-gateway",
    "apps/cli",
    "crates/interceptor",
    "crates/extractor",
    "crates/detector",
    "crates/policy-engine",
    "crates/ai-engine",
    "crates/logger",
    "crates/metrics",
    "crates/config",
    "crates/common",
]

# Shared dependency versions across the whole workspace.
# Individual crates reference these via `workspace = true` so every
# crate stays on the same version — no dependency drift between modules.
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Dipanshu <EnaLisis>"]
license = "Proprietary"
